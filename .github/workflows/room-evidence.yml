name: Room Evidence Emulator

on:
  push:
    branches:
      - room-evidence-temp

jobs:
  room-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout scratch branch
        uses: actions/checkout@v4

      - name: Checkout official Inventory codelab
        uses: actions/checkout@v4
        with:
          repository: google-developer-training/basic-android-kotlin-compose-training-inventory-app
          ref: main
          path: inventory

      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Add deterministic seed test and UI helper
        shell: bash
        run: |
          mkdir -p inventory/app/src/androidTest/java/com/example/inventory
          cat > inventory/app/src/androidTest/java/com/example/inventory/SeedDatabaseTest.kt <<'EOF'
          package com.example.inventory

          import androidx.test.ext.junit.runners.AndroidJUnit4
          import androidx.test.platform.app.InstrumentationRegistry
          import com.example.inventory.data.InventoryDatabase
          import com.example.inventory.data.Item
          import kotlinx.coroutines.runBlocking
          import org.junit.Test
          import org.junit.runner.RunWith

          @RunWith(AndroidJUnit4::class)
          class SeedDatabaseTest {
              @Test
              fun seedVisibleInventory() = runBlocking {
                  val context = InstrumentationRegistry.getInstrumentation().targetContext
                  val dao = InventoryDatabase.getDatabase(context).itemDao()
                  dao.insert(Item(101, "Apples", 10.0, 20))
                  dao.insert(Item(102, "Bananas", 15.0, 12))
                  dao.insert(Item(103, "Coffee", 85.0, 8))
              }
          }
          EOF

          cat > tap_text.py <<'PY'
          import re
          import subprocess
          import sys
          import xml.etree.ElementTree as ET

          target = sys.argv[1]
          subprocess.run(["adb","shell","uiautomator","dump","/sdcard/window.xml"], check=True)
          subprocess.run(["adb","pull","/sdcard/window.xml","window.xml"], check=True, stdout=subprocess.DEVNULL)
          root = ET.parse("window.xml").getroot()
          for node in root.iter("node"):
              text = node.attrib.get("text","")
              desc = node.attrib.get("content-desc","")
              if target.lower() in text.lower() or target.lower() in desc.lower():
                  m = re.match(r"\[(\d+),(\d+)\]\[(\d+),(\d+)\]", node.attrib["bounds"])
                  if not m:
                      continue
                  x1,y1,x2,y2 = map(int,m.groups())
                  x,y = (x1+x2)//2, (y1+y2)//2
                  subprocess.run(["adb","shell","input","tap",str(x),str(y)], check=True)
                  print(f"Tapped {target} at {x},{y}")
                  sys.exit(0)
          print(f"Target not found: {target}")
          subprocess.run(["cat","window.xml"])
          sys.exit(1)
          PY

      - name: Run Room tests and capture emulator evidence
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            set -e
            cd inventory
            chmod +x gradlew

            ./gradlew connectedDebugAndroidTest --stacktrace | tee ../connected-test.log
            ./gradlew installDebug installDebugAndroidTest

            adb shell am instrument -w -e class com.example.inventory.SeedDatabaseTest com.example.inventory.test/androidx.test.runner.AndroidJUnitRunner | tee ../seed-test.log

            adb shell am force-stop com.example.inventory
            adb shell monkey -p com.example.inventory -c android.intent.category.LAUNCHER 1
            sleep 4
            adb exec-out screencap -p > ../01_inventory_home.png

            cd ..
            python3 tap_text.py Apples
            sleep 2
            adb exec-out screencap -p > 02_item_details_before.png

            python3 tap_text.py Sell
            sleep 2
            adb exec-out screencap -p > 03_item_details_after_sell.png

            adb shell am force-stop com.example.inventory
            adb shell monkey -p com.example.inventory -c android.intent.category.LAUNCHER 1
            sleep 3
            adb exec-out screencap -p > 04_inventory_home_after_update.png

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: room-emulator-evidence
          path: |
            01_inventory_home.png
            02_item_details_before.png
            03_item_details_after_sell.png
            04_inventory_home_after_update.png
            connected-test.log
            seed-test.log
            inventory/app/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
