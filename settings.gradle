// Repositorios usados para localizar los plugins de Gradle.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

// Centraliza los repositorios de dependencias para todos los módulos.
dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

// Nombre del proyecto y registro del único módulo de la aplicación.
rootProject.name = "BasicStateCodelab"
include ':app'
